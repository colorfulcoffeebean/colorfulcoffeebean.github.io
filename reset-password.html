<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Reset Password | Colorful Coffee Bean</title>


  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f3eb;
      color: #2c2118;
    }


    .container {
      max-width: 480px;
      margin: 80px auto;
      padding: 20px;
    }


    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }


    .logo {
      display: block;
      width: 130px;
      height: 130px;
      object-fit: contain;
      margin: 0 auto 15px;
    }


    h1 {
      text-align: center;
      margin-bottom: 10px;
    }


    .description {
      text-align: center;
      color: #66584c;
      line-height: 1.6;
      margin-bottom: 25px;
    }


    .form-group {
      margin-bottom: 18px;
    }


    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }


    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }


    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #38291f;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }


    button:hover {
      background: #594235;
    }


    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }


    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      line-height: 1.5;
    }


    .success {
      display: block;
      background: #eef7ed;
      color: #356134;
      border: 1px solid #b9d7b7;
    }


    .error {
      display: block;
      background: #fff0f0;
      color: #9b2c2c;
      border: 1px solid #e4b9b9;
    }


    .admin-link {
      text-align: center;
      margin-top: 20px;
    }


    .admin-link a {
      color: #38291f;
    }


  </style>

</head>


<body>


<div class="container">

  <div class="card">


    <img
      src="images/colorful-coffee-bean-logo.png"
      alt="Colorful Coffee Bean"
      class="logo"
    >


    <h1>
      Reset Password
    </h1>


    <p class="description">
      Enter a new password for your
      Colorful Coffee Bean Admin account.
    </p>


    <div class="form-group">

      <label for="newPassword">
        New Password
      </label>

      <input
        id="newPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter new password"
      >

    </div>


    <div class="form-group">

      <label for="confirmPassword">
        Confirm New Password
      </label>

      <input
        id="confirmPassword"
        type="password"
        autocomplete="new-password"
        placeholder="Enter password again"
      >

    </div>


    <button
      id="updateButton"
      onclick="updatePassword()"
    >
      Update Password
    </button>


    <div
      id="message"
      class="message"
    ></div>


    <div class="admin-link">

      <a href="admin.html">
        Return to Admin Login
      </a>

    </div>


  </div>

</div>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
  "https://zdsvsmtphqwjlskkphnu.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_BxQZ5lBBYcKuIF6_bVScFw_W8tWxnwZ";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );



function showMessage(
  text,
  type
) {

  const box =
    document.getElementById("message");


  box.textContent =
    text;


  box.className =
    "message " + type;

}



// Check for an error returned by Supabase
// such as an expired recovery link.

const hashParams =
  new URLSearchParams(
    window.location.hash.substring(1)
  );


if (
  hashParams.get("error")
) {

  const description =
    hashParams.get("error_description") ||
    "The password reset link is invalid or has expired.";


  showMessage(
    description.replaceAll("+", " "),
    "error"
  );

}



// Supabase automatically reads the recovery
// session from the URL when this page loads.

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (
      event === "PASSWORD_RECOVERY"
    ) {

      console.log(
        "Password recovery session ready."
      );

    }

  }
);



async function updatePassword() {

  const newPassword =
    document
      .getElementById("newPassword")
      .value;


  const confirmPassword =
    document
      .getElementById("confirmPassword")
      .value;


  const button =
    document
      .getElementById("updateButton");



  if (
    !newPassword ||
    !confirmPassword
  ) {

    showMessage(
      "Please enter the new password twice.",
      "error"
    );

    return;

  }



  if (
    newPassword !==
    confirmPassword
  ) {

    showMessage(
      "The passwords do not match.",
      "error"
    );

    return;

  }



  if (
    newPassword.length < 8
  ) {

    showMessage(
      "Please use a password with at least 8 characters.",
      "error"
    );

    return;

  }



  button.disabled =
    true;


  button.textContent =
    "Updating Password...";



  try {

    const {
      data: sessionData,
      error: sessionError
    } =
      await supabaseClient.auth.getSession();



    if (
      sessionError ||
      !sessionData.session
    ) {

      throw new Error(
        "The password reset link is invalid or has expired. Please request a new password reset email."
      );

    }



    const {
      data,
      error
    } =
      await supabaseClient.auth.updateUser({

        password:
          newPassword

      });



    if (error) {

      throw error;

    }



    showMessage(
      "Password updated successfully. You can now return to the Admin Login page and sign in with your new password.",
      "success"
    );



    document
      .getElementById("newPassword")
      .value = "";


    document
      .getElementById("confirmPassword")
      .value = "";



    button.textContent =
      "Password Updated";

  }

  catch (error) {

    showMessage(
      error.message,
      "error"
    );


    button.disabled =
      false;


    button.textContent =
      "Update Password";

  }

}



// Allow Enter key to submit.

document
  .getElementById("confirmPassword")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        updatePassword();

      }

    }
  );


</script>


</body>

</html>
