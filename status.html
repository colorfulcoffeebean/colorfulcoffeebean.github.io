<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorful Coffee Bean | Order Status</title>
<style>
body { margin:0; font-family:Arial,sans-serif; background:#f7f3eb; color:#2c2118; }
.container { max-width:760px; margin:auto; padding:30px 20px; }
header { text-align:center; padding:45px 20px 25px; }
.brand { display:flex; align-items:center; justify-content:center; gap:16px; }
.brand-logo { width:110px; height:110px; object-fit:contain; }
h1 { margin:0; font-size:2.6rem; }
h2 { border-bottom:1px solid #d6cabc; padding-bottom:10px; }
.card { background:white; border-radius:12px; padding:24px; box-shadow:0 3px 12px rgba(0,0,0,.08); margin-bottom:20px; }
.form-group { margin-bottom:16px; }
label { display:block; font-weight:bold; margin-bottom:7px; }
input { width:100%; box-sizing:border-box; padding:13px; border:1px solid #ccc; border-radius:8px; font-size:16px; }
.button { padding:13px 22px; border:0; border-radius:8px; background:#38291f; color:white; cursor:pointer; font-size:16px; }
.button:hover { background:#594235; }
.muted { color:#66584c; line-height:1.6; }
.hidden { display:none !important; }
#error { color:#9b2c2c; margin-top:14px; }
.order-number { font-size:1.35rem; font-weight:bold; margin-bottom:6px; }
.status-title { font-size:1.2rem; font-weight:bold; margin:18px 0 12px; }
.timeline { margin:20px 0 28px; }
.step { display:flex; gap:14px; align-items:flex-start; position:relative; padding-bottom:20px; }
.step:not(:last-child)::after { content:""; position:absolute; left:10px; top:22px; width:2px; height:calc(100% - 4px); background:#d6cabc; }
.dot { width:22px; height:22px; border-radius:50%; border:2px solid #8a5b35; box-sizing:border-box; background:white; flex:0 0 auto; z-index:1; }
.step.done .dot, .step.current .dot { background:#8a5b35; }
.step.current .label { font-weight:bold; }
.item { background:#f7f3eb; padding:13px; border-radius:8px; margin-top:10px; }
.summary { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:18px; }
.summary div { background:#f7f3eb; padding:12px; border-radius:8px; }
footer { text-align:center; padding:35px; color:#777; }
@media(max-width:600px) { h1{font-size:1.8rem} .brand-logo{width:80px;height:80px} .summary{grid-template-columns:1fr} }
</style>
</head>
<body>
<header>
  <div class="brand">
    <img src="images/colorful-coffee-bean-logo.png" alt="Colorful Coffee Bean Logo" class="brand-logo">
    <h1>Colorful Coffee Bean</h1>
  </div>
  <p class="muted">Check the progress of your coffee order.</p>
</header>

<div class="container">
  <div class="card">
    <h2>Check Your Order</h2>
    <p class="muted">Enter your order number and the email address used when placing the order.</p>
    <div class="form-group">
      <label for="orderCode">Order Number</label>
      <input id="orderCode" type="text" inputmode="numeric" placeholder="Example: 26092401">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="your@email.com">
    </div>
    <button id="checkButton" class="button" onclick="checkStatus()">Check Order Status</button>
    <div id="error"></div>
  </div>

  <div id="result" class="card hidden"></div>
</div>

<footer>© 2026 Colorful Coffee Bean</footer>

<script>
const SUPABASE_URL = 'https://xzvomecpkgztozvnylfz.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_YZyVqJsWa5j8Hxt8BCqFgg_inirk0Hd';

const labels = {
  new: "Order Received",
  roasting: "Roasting",
  quality_check: "Quality Check",
  ready: "Ready",
  shipped: "Shipped",
  completed: "Completed",
  cancelled: "Cancelled"
};

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

function timeline(status, fulfillment) {
  if (status === "cancelled") {
    return '<div class="timeline"><div class="step current"><span class="dot"></span><div class="label">Cancelled</div></div></div>';
  }

  const steps = fulfillment === "shipping"
    ? ["new","roasting","quality_check","ready","shipped","completed"]
    : ["new","roasting","quality_check","ready","completed"];

  const display = {
    new:"Order Received",
    roasting:"Roasting",
    quality_check:"Quality Check",
    ready: fulfillment === "shipping" ? "Ready" : "Ready for Pickup",
    shipped:"Shipped",
    completed:"Completed"
  };

  let current = steps.indexOf(status);
  if (current < 0) current = 0;

  return '<div class="timeline">' + steps.map((s,i) => {
    const cls = i < current ? "done" : (i === current ? "current" : "");
    const mark = i < current ? "✓ " : "";
    return '<div class="step '+cls+'"><span class="dot"></span><div class="label">'+mark+esc(display[s])+'</div></div>';
  }).join("") + '</div>';
}

async function checkStatus() {
  const code = document.getElementById("orderCode").value.trim();
  const email = document.getElementById("email").value.trim();
  const error = document.getElementById("error");
  const resultBox = document.getElementById("result");
  const button = document.getElementById("checkButton");

  error.textContent = "";
  resultBox.classList.add("hidden");

  if (!code || !email) {
    error.textContent = "Please enter your order number and email.";
    return;
  }

  button.disabled = true;
  button.textContent = "Checking...";

  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/rpc/check_order_status", {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":"Bearer " + SUPABASE_PUBLISHABLE_KEY
      },
      body:JSON.stringify({p_order_code:code,p_email:email})
    });

    const data = await r.json();
    if (!r.ok) throw new Error(data.message || "Unable to check order status.");

    if (!data.found) {
      error.textContent = "Order not found. Please check your order number and email.";
      return;
    }

    const items = (data.items || []).map(i =>
      '<div class="item"><strong>'+esc(i.coffee_name)+'</strong><br>'+
      esc(i.size)+' · '+esc(i.roast_level)+
      '<br>$'+Number(i.unit_price).toFixed(2)+'</div>'
    ).join("");

    const fulfillment = data.fulfillment === "shipping" ? "Shipping" : "Local Pickup";
    const statusText = data.status === "ready" && data.fulfillment !== "shipping"
      ? "Ready for Pickup"
      : (labels[data.status] || data.status);

    resultBox.innerHTML =
      '<div class="order-number">Order #'+esc(data.order_code)+'</div>'+
      '<div class="muted">Placed '+new Date(data.created_at).toLocaleString()+'</div>'+
      '<div class="status-title">Current Status: '+esc(statusText)+'</div>'+
      timeline(data.status, data.fulfillment)+
      '<h3>Your Coffee</h3>'+items+
      '<div class="summary">'+
        '<div><strong>Delivery</strong><br>'+esc(fulfillment)+'</div>'+
        '<div><strong>Total</strong><br>$'+Number(data.total).toFixed(2)+'</div>'+
        '<div><strong>Coffee</strong><br>$'+Number(data.subtotal).toFixed(2)+'</div>'+
        '<div><strong>Shipping</strong><br>$'+Number(data.shipping).toFixed(2)+'</div>'+
      '</div>';

    resultBox.classList.remove("hidden");
  } catch(e) {
    console.error(e);
    error.textContent = "Your order status could not be loaded. Please try again.";
  } finally {
    button.disabled = false;
    button.textContent = "Check Order Status";
  }
}

document.getElementById("email").addEventListener("keydown", e => {
  if (e.key === "Enter") checkStatus();
});
</script>
</body>
</html>
